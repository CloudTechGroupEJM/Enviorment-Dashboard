image: golang:1.25.6-alpine

stages:
  - vet
  - test
  - build

variables:
  GO_MODULE: "envdash"

# Cache Go modules between jobs
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .go-cache/

before_script:
  - export GOPATH="$CI_PROJECT_DIR/.go-cache"
  - export PATH="$GOPATH/bin:$PATH"

# Linting job using go vet
vet:
  stage: vet
  script:
    - go vet ./...
  only:
    - merge_requests
    - main

# Testing job with coverage reporting
test:
  stage: test
  script:
    - CGO_ENABLED=0 go test -v ./...
  artifacts:
    paths:
      - ./test
    expire_in: 1 day
  only:
    - merge_requests
    - main

# Build job to create the binary
build:
  stage: build
  script:
    - CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o app ./cmd/main.go
  artifacts:
    paths:
      - app
    expire_in: 1 hour
  only:
    - merge_requests
    - main
